services:
  api:
    container_name: biblioteca-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - biblioteca-network

networks:
  biblioteca-network:
    external: true
